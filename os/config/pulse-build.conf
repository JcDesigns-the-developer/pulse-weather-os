# Pulse Weather OS build settings
# Edit this file to customize the ISO without editing scripts.
# Values are read by scripts/build-iso.sh.

PULSE_OS_NAME="Pulse Weather OS"
PULSE_DISTRO="trixie"
PULSE_ARCH="amd64"
PULSE_IMAGE_NAME="pulse-weather-os"
PULSE_INSTALLER_MODE="live"
PULSE_INSTALLER_GUI="true"
PULSE_INCLUDE_RECOMMENDS="true"
PULSE_ISO_PUBLISHER="JcDesigns"
PULSE_ISO_VOLUME="PULSE_WEATHER_OS"
# Profiles: base, meteorology, developer
PULSE_PACKAGE_PROFILE="meteorology"
