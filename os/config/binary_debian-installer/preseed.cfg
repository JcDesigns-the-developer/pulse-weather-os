# Pulse Weather OS Debian Installer defaults.
# Intentionally does NOT preselect a disk, partitioning recipe, user password,
# or unattended installation. The installer must ask the user before disk changes.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string UTC
d-i clock-setup/utc boolean true
